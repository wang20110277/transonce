<!doctype html>
<!-- 图标底图：1024 画布，透明背景；内容方块占 ~82%（macOS 图标栅格规范，

<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; overflow: hidden; background: transparent; }
  svg { width: 1024px; height: 1024px; display: block; }
</style>
